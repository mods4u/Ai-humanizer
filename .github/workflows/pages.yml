name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run using this workflow's
          # pages:write permission — no repo-admin action needed.
          enablement: true

      - name: Ensure Actions-based build type
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || echo "")
          echo "Current Pages build type: ${BUILD_TYPE:-unknown}"
          if [ "$BUILD_TYPE" != "workflow" ]; then
            echo "Switching Pages build type to 'workflow'..."
            gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html favicon.svg _site/
          cp -r css js _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
